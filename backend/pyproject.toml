[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diagram-agent-backend"
version = "0.1.0"
description = "AI-powered architecture diagramming agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "graphviz>=0.20,<1.0",
    "websockets>=12.0,<14.0",
    "azure-ai-projects>=2.0.0b3",
    "azure-identity>=1.16.0,<2.0",
    "openai>=1.30.0,<2.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "black>=24.0,<25.0",
    "isort>=5.13,<6.0",
    "pylint>=3.0,<4.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["missing-docstring", "too-few-public-methods"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
